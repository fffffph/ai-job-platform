# ============================================
# 子应用 nginx 配置（静态资源托管）
# ============================================

server {
    listen 80;
    server_name localhost;

    # 静态文件根目录（Dockerfile 里把产物拷到了这里）
    root /usr/share/nginx/html;

    # 开启 gzip，UMD 包通常 1MB+，压缩后传输体积可降 70%
    gzip on;
    gzip_types application/javascript text/css application/json;
    gzip_min_length 1024;

    # ------------------------------------------------------------
    # 子应用路径：/resume-optimizer/
    # ------------------------------------------------------------
    # 使用 alias 而不是 root 的区别：
    #   root：最终路径 = root + location路径 + 文件名
    #   alias：最终路径 = alias + 文件名（location 前缀被替换掉）
    # 这里用 alias 正好把 /resume-optimizer/ 映射到目录本身
    location /resume-optimizer/ {
        alias /usr/share/nginx/html/resume-optimizer/;

        # 找不到文件时兜底返回入口 HTML
        try_files $uri $uri/ /resume-optimizer/index.html;

        # 允许跨域。
        # 虽然当前是同源部署（都走 nginx:8080），但保留这个头可以兼容
        # 未来子应用独立域名部署的场景，也方便本地直接调试
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;

        # UMD 包内容更新频繁，禁止强缓存，避免改了代码浏览器还用旧的
        add_header Cache-Control 'no-cache' always;
    }

    # 访问 /resume-optimizer（无尾斜杠）时重定向到带斜杠的形式，
    # 保证 qiankun entry 配置（'/resume-optimizer/'）始终命中
    location = /resume-optimizer {
        return 301 /resume-optimizer/;
    }

    # 根路径：子应用容器不提供主页，直接 404（主页由入口 nginx 转给主应用）
    location = / {
        return 404;
    }
}
