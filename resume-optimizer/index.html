<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI简历优化 - CareerAI</title>
    <style>
      /* 基础样式重置，确保子应用在独立运行时也有正常样式 */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 
      注意：在 qiankun 环境中，此 HTML 不会被直接使用。
      qiankun 会通过 fetch 获取此 HTML，然后提取其中的 JS/CSS 资源进行加载。
      独立开发时（npm run dev），此 HTML 作为正常的 SPA 入口。
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
