# ============================================
# 入口 nginx 配置（统一反向代理）
# ============================================
#
# 【为什么要有这一层】
# 开发环境是三个端口直连（3000/3001/4000），
# 生产环境对外只暴露一个端口（8080），由 nginx 按路径分发：
#
#   浏览器请求                        → 转发到
#   /                                 → web 容器 :3000   (Next.js 页面)
#   /api/auth/* /api/user/* /api/resume/*  → server 容器 :4000 (Express)
#   /resume-optimizer/*               → subapp 容器 :80   (子应用 UMD 静态)
#
# 好处：浏览器全程只跟 nginx:8080 通信 → 全部同源
#       → 没有跨域问题（开发环境那一堆 CORS 头生产环境就不需要了）
# ============================================

# upstream：给后端服务起个别名，便于负载均衡和可读性。
# 这里的名字 web/server/subapp 就是 docker-compose 里的服务名，
# Docker 内置 DNS 会自动解析成对应容器的 IP。
upstream web {
    server web:3000;
}

upstream server_api {
    server server:4000;
}

upstream subapp {
    server subapp:80;
}

server {
    listen 80;
    server_name localhost;

    # ------------------------------------------------------------
    # 【必加参数 1】请求体大小限制
    # nginx 默认只允许 1MB 的请求体，超过直接返回 413。
    # 本项目的简历上传（PDF/DOCX）后端限制是 10MB，
    # 这里必须放开到 >= 10MB，否则上传大简历会被 nginx 拦下，
    # 而且错误发生在到达后端之前 —— 后端日志里什么都看不到，极难排查。
    # ------------------------------------------------------------
    client_max_body_size 20m;

    # ------------------------------------------------------------
    # 【必加参数 2】代理超时
    # AI 简历优化要调用 DeepSeek，实测 15~25 秒才返回。
    # nginx 默认 proxy_read_timeout 是 60 秒，勉强够但不保险；
    # 设成 120 秒避免网络波动时提前断开（前端也会出现"请求被取消"）。
    # ------------------------------------------------------------
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # ------------------------------------------------------------
    # 后端 API 路由
    # ------------------------------------------------------------
    # 按前缀精确转发 Express 拥有的路由。
    # 为什么不直接转发所有 /api/ ？
    #   因为主应用（Next.js）里还有历史 API 路由（如 /api/chat），
    #   笼统转发会让它们 404。精确匹配保证两边都能工作。
    location /api/auth/ {
        proxy_pass http://server_api;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    location /api/user/ {
        proxy_pass http://server_api;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    location /api/resume/ {
        proxy_pass http://server_api;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    location = /api/health {
        proxy_pass http://server_api;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    # ------------------------------------------------------------
    # 子应用静态资源
    # ------------------------------------------------------------
    location /resume-optimizer/ {
        proxy_pass http://subapp;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    # ------------------------------------------------------------
    # 兜底：其余全部交给 Next.js 主应用
    # ------------------------------------------------------------
    # 包括页面路由 /、/dashboard/*，以及历史 /api/chat 等 Next API
    location / {
        proxy_pass http://web;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }
}
