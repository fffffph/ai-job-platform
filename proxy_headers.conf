# ============================================
# 反向代理通用请求头（被 nginx.conf 各 location 复用）
# ============================================
# 用 include 复用，避免在 nginx.conf 里重复贴 8 行头信息。
# 这些头的作用：把客户端的真实信息透传给后端，
# 否则后端日志里看到的 IP 全是 nginx 容器的 IP。

# 保留原始 Host（后端若按域名做路由/校验需要）
proxy_set_header Host $host;

# 真实客户端 IP 链。
# X-Real-IP：直接放客户端 IP
proxy_set_header X-Real-IP $remote_addr;
# X-Forwarded-For：追加式链，经过多层代理时记录完整路径
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# 客户端实际使用的协议（http/https）。
# 后端据此生成正确的回调 URL、判断是否为安全连接
proxy_set_header X-Forwarded-Proto $scheme;

# 透传原始 Host（部分框架用它做 CSRF 校验）
proxy_set_header X-Forwarded-Host $host;

# 支持 WebSocket 升级。
# 生产环境 Next.js 不需要，但保留可兼容将来接 WebSocket 服务
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

# 关闭缓冲（对 SSE / 流式响应友好）。
# 本项目 AI 接口目前是一次性返回，但保留这个设置可支持流式输出
proxy_buffering off;
